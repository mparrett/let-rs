[package]
name    = "wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to match the installed `wasm-bindgen` CLI (0.2.114). Bump in tandem
# with the CLI: `cargo install -f wasm-bindgen-cli --version <new>` then update
# this line.
wasm-bindgen             = "=0.2.114"
console_error_panic_hook = "0.1"
lisp   = { path = "../lisp" }
runes  = { path = "../runes" }
codons = { path = "../codons" }
spells = { path = "../spells" }
genes  = { path = "../genes" }
world  = { path = "../world" }
