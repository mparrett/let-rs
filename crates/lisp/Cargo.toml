[package]
name    = "lisp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Dev-only: example binaries consume DSL crates. The lisp crate itself
# stays zero-deps — ADR-002 still holds.
[dev-dependencies]
runes  = { path = "../runes" }
codons = { path = "../codons" }

[[example]]
name = "repl"
path = "examples/repl.rs"

[[example]]
name = "spells"
path = "examples/spells.rs"

[[example]]
name = "world"
path = "examples/world.rs"

[[example]]
name = "genes"
path = "examples/genes.rs"
