[package]
name    = "lisp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Dev-only: the spells example consumes the runes crate to demonstrate the
# rune-tape pipeline. ADR-002 still holds — no runtime deps on the lisp crate.
[dev-dependencies]
runes = { path = "../runes" }

[[example]]
name = "repl"
path = "examples/repl.rs"

[[example]]
name = "spells"
path = "examples/spells.rs"

[[example]]
name = "world"
path = "examples/world.rs"
