[package]
name    = "lisp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Dev-only: example binaries consume DSL crates. The lisp crate itself
# stays zero-deps — ADR-002 still holds. The `macros` dev-dep is the
# loop-back into the macros sibling crate (ADR-024) so the REPL example
# can wrap a MacroVm and support `defmacro`. Cargo allows this loop
# because dev-deps don't participate in the library's dep graph.
[dev-dependencies]
runes   = { path = "../runes" }
codons  = { path = "../codons" }
strokes = { path = "../strokes" }
spells  = { path = "../spells" }
genes   = { path = "../genes" }
curves  = { path = "../curves" }
world   = { path = "../world" }
macros  = { path = "../macros" }

[[example]]
name = "repl"
path = "examples/repl.rs"

[[example]]
name = "spells"
path = "examples/spells.rs"

[[example]]
name = "world"
path = "examples/world.rs"

[[example]]
name = "genes"
path = "examples/genes.rs"

[[example]]
name = "curves"
path = "examples/curves.rs"
