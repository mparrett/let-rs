[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
edition     = "2024"
license     = "MIT"
repository  = "https://github.com/mparrett/let-rs"
description = "A small functional Lisp on a CEK abstract machine, in zero-dependency Rust"

[workspace.lints.rust]
unsafe_code = "forbid"

# Clippy defaults workspace-wide. We stay on the `correctness`/`suspicious`/
# `style`/`complexity`/`perf` groups (clippy's default `all`) — `pedantic`
# and `nursery` produce too much noise against the CEK style (deep matches,
# Rc<RefCell<…>>, small helpers) without improving the code. Local runs
# warn; CI/`just lint` denies via `-D warnings`.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
